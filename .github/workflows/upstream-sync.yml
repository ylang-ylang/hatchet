name: Daily upstream sync

on:
  schedule:
    # 03:17 UTC / 11:17 China Standard Time. The non-round minute avoids the
    # busiest part of GitHub's scheduled-run queue.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and test even when the upstream SHA is unchanged
        required: false
        default: false
        type: boolean

concurrency:
  group: daily-upstream-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Replay downstream patches
    permissions:
      contents: write
      # NOTE: GITHUB_TOKEN cannot push .github/workflows/* changes.
      # A PAT with the `workflow` scope is required. Set it as a repo secret
      # named WORKFLOW_PAT; if absent the sync will fail with a clear error
      # when downstream commits touch workflow files.
    runs-on: ubuntu-latest
    outputs:
      state: ${{ steps.sync.outputs.state }}
      target_sha: ${{ steps.sync.outputs.target_sha }}
      upstream_sha: ${{ steps.sync.outputs.upstream_sha }}
      base_sha: ${{ steps.sync.outputs.base_sha }}
      candidate_sha: ${{ steps.sync.outputs.candidate_sha }}
      conflict_files: ${{ steps.sync.outputs.conflict_files }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch/statement-timeout-set-local
          fetch-depth: 0
          # GITHUB_TOKEN cannot push .github/workflows/* changes. A PAT with
          # the `workflow` scope is required. Set WORKFLOW_PAT as a repo secret;
          # if absent, sync fails with a clear error when downstream commits
          # touch workflow files.
          token: ${{ secrets.WORKFLOW_PAT || secrets.GITHUB_TOKEN }}
      - name: Prepare candidate branch
        id: sync
        env:
          TARGET_BRANCH: patch/statement-timeout-set-local
          CANDIDATE_BRANCH: automation/upstream-sync
          UPSTREAM_URL: https://github.com/hatchet-dev/hatchet.git
          UPSTREAM_BRANCH: main
          FORCE_SYNC: ${{ inputs.force || 'false' }}
        run: |
          cp .github/scripts/prepare-upstream-sync.sh /tmp/prepare-upstream-sync
          bash /tmp/prepare-upstream-sync

  validate:
    name: Validate candidate (go build)
    permissions:
      contents: read
    needs: prepare
    if: needs.prepare.outputs.state == 'ready'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_PAT || secrets.GITHUB_TOKEN }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: go build
        run: go build ./...

  promote:
    name: Promote validated candidate
    permissions:
      actions: write
      contents: write
      issues: write
    needs: [prepare, validate]
    if: >-
      needs.prepare.outputs.state == 'ready' &&
      needs.validate.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      # Re-emitted so image-build jobs can consume it without depending on
      # prepare (GitHub only exposes outputs of direct job dependencies).
      candidate_sha: ${{ steps.record.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch/statement-timeout-set-local
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_PAT || secrets.GITHUB_TOKEN }}
      - name: Record candidate SHA
        id: record
        env:
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
        run: echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
      - name: Atomically update the downstream branch
        env:
          TARGET_BRANCH: patch/statement-timeout-set-local
          EXPECTED_OLD_SHA: ${{ needs.prepare.outputs.target_sha }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
        run: |
          git fetch origin "$CANDIDATE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE_SHA"
          git push origin \
            "$CANDIDATE_SHA:refs/heads/$TARGET_BRANCH" \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_OLD_SHA"
          {
            echo "## Upstream sync promoted"
            echo "- Upstream: \`$UPSTREAM_SHA\`"
            echo "- Downstream: \`$CANDIDATE_SHA\`"
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Close a previous sync issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Automated upstream sync needs attention";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            for (const issue of issues.filter(issue => issue.title === title)) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }

  build-images:
    name: Build patched server images
    permissions:
      contents: read
      packages: write
    needs: promote
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # hatchet-api is included because the dashboard image is built on top
        # of it (build/package/dashboard.dockerfile's HATCHET_API_IMAGE base).
        target: [engine, migrate, admin, api]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.promote.outputs.candidate_sha }}
          fetch-depth: 0
      - name: Compute version and short SHA
        id: meta
        env:
          CANDIDATE_SHA: ${{ needs.promote.outputs.candidate_sha }}
        run: |
          echo "short=${CANDIDATE_SHA:0:8}" >> "$GITHUB_OUTPUT"
          # Only v* tags are real engine releases; bare `git describe` can
          # pick SDK tags (e.g. py/1.38.0), which the SDK's semver engine
          # check cannot parse and would misread as an old engine.
          echo "version=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo v0.0.0)" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push hatchet-${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/package/servers.dockerfile
          build-args: |
            SERVER_TARGET=${{ matrix.target }}
            VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/ylang-ylang/hatchet/hatchet-${{ matrix.target }}:latest-patched
            ghcr.io/ylang-ylang/hatchet/hatchet-${{ matrix.target }}:${{ steps.meta.outputs.short }}
          push: true

  build-dashboard:
    name: Build patched dashboard image
    permissions:
      contents: read
      packages: write
    needs: [promote, build-images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.promote.outputs.candidate_sha }}
          fetch-depth: 0
      - name: Compute short SHA
        id: meta
        env:
          CANDIDATE_SHA: ${{ needs.promote.outputs.candidate_sha }}
        run: echo "short=${CANDIDATE_SHA:0:8}" >> "$GITHUB_OUTPUT"
      - name: Generate docs snippets and examples
        # The dashboard frontend imports @/lib/generated/docs, which is
        # gitignored and produced by this generator (mirrors upstream
        # build.yml). Without it `npm run build` fails in the image build.
        working-directory: frontend/snippets
        run: python3 generate.py
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/package/dashboard.dockerfile
          # The dashboard Dockerfile does `FROM $HATCHET_API_IMAGE`; apibase is
          # a named build context resolving to the api image pushed above.
          build-args: HATCHET_API_IMAGE=apibase
          build-contexts: apibase=docker-image://ghcr.io/ylang-ylang/hatchet/hatchet-api:latest-patched
          tags: |
            ghcr.io/ylang-ylang/hatchet/hatchet-dashboard:latest-patched
            ghcr.io/ylang-ylang/hatchet/hatchet-dashboard:${{ steps.meta.outputs.short }}
          push: true

  report-failure:
    name: Report blocked sync
    permissions:
      contents: read
      issues: write
    needs: [prepare, validate, promote]
    if: >-
      ${{ always() && (
        needs.prepare.result != 'success' ||
        needs.prepare.outputs.state == 'conflict' ||
        (needs.prepare.outputs.state == 'ready' && (
          needs.validate.result != 'success' ||
          needs.promote.result != 'success'
        ))
      ) }}
    runs-on: ubuntu-latest
    env:
      SYNC_STATE: ${{ needs.prepare.outputs.state }}
      CONFLICT_FILES: ${{ needs.prepare.outputs.conflict_files }}
      BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
      UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
      PREPARE_RESULT: ${{ needs.prepare.result }}
      VALIDATE_RESULT: ${{ needs.validate.result }}
      PROMOTE_RESULT: ${{ needs.promote.result }}
    steps:
      - name: Create or update the sync issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Automated upstream sync needs attention";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The daily upstream replay was not promoted.",
              "",
              `- State: \`${process.env.SYNC_STATE || "workflow failure"}\``,
              `- Previous base: \`${process.env.BASE_SHA || "unknown"}\``,
              `- Upstream head: \`${process.env.UPSTREAM_SHA || "unknown"}\``,
              `- Conflicts: \`${process.env.CONFLICT_FILES || "none reported"}\``,
              `- Prepare: \`${process.env.PREPARE_RESULT}\``,
              `- Validate: \`${process.env.VALIDATE_RESULT}\``,
              `- Promotion: \`${process.env.PROMOTE_RESULT}\``,
              "",
              `[Open workflow run](${runUrl})`,
              "",
              "The stable branch is only promoted after candidate validation. If the promotion job failed, inspect whether its atomic push completed before a post-promotion step failed.",
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Another sync attempt was blocked: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
